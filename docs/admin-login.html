<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — 도운사</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<style>
  :root {
    --cream: #F7F4EF; --ink: #1E1C18; --ink-light: #4A4740; --ink-muted: #8A877F;
    --gold: #B8975A; --border: rgba(30,28,24,0.12);
    --serif: 'Noto Serif KR', serif; --sans: 'Noto Sans KR', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--cream); font-family: var(--sans); font-weight: 300; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 100%; max-width: 360px; padding: 2rem 1.5rem; text-align: center; }
  .logo { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 0.4rem; color: var(--gold); }
  .sub { font-size: 0.78rem; color: rgba(247,244,239,0.5); margin-bottom: 2.5rem; }
  .google-btn {
    width: 100%; background: var(--cream); color: var(--ink); border: none; padding: 0.9rem 1.2rem;
    font-family: var(--sans); font-size: 0.88rem; letter-spacing: 0.03em; cursor: pointer; transition: opacity 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
  }
  .google-btn:hover { opacity: 0.88; }
  .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .error { color: #E08080; font-size: 0.78rem; margin-top: 1.2rem; display: none; line-height: 1.7; }
  .error.show { display: block; }
  .setup-warn { font-size: 0.72rem; color: rgba(247,244,239,0.4); margin-top: 2rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
  <p class="logo">道運寺</p>
  <p class="sub">관리자 로그인</p>

  <button class="google-btn" onclick="doLogin()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.8 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.6 5.6C40.9 36.3 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Google 계정으로 로그인
  </button>

  <p class="error" id="err"></p>
  <p class="setup-warn" id="setupWarn" style="display:none;">
    Firebase가 아직 설정되지 않았거나, Firebase 콘솔 &gt; Authentication &gt; Sign-in method 에서
    "Google" 로그인이 아직 켜지지 않았습니다.
  </p>
</div>
<script>
  // 이 계정으로 로그인한 경우에만 관리자로 인정합니다.
  const ADMIN_EMAIL = 'a01020581925@gmail.com';

  if (!FIREBASE_READY) {
    document.getElementById('setupWarn').style.display = 'block';
  }

  function doLogin() {
    if (!FIREBASE_READY) return;
    const errEl = document.getElementById('err');
    errEl.classList.remove('show');

    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider)
      .then((result) => {
        if (result.user.email !== ADMIN_EMAIL) {
          firebase.auth().signOut();
          errEl.textContent = '관리자 계정이 아닙니다 (' + result.user.email + ').';
          errEl.classList.add('show');
          return;
        }
        window.location.href = 'admin-dashboard.html';
      })
      .catch((err) => {
        console.error(err);
        errEl.textContent = '로그인에 실패했습니다. 다시 시도해주세요.';
        errEl.classList.add('show');
      });
  }

  // 이미 로그인되어 있으면 바로 대시보드로
  if (FIREBASE_READY) {
    firebase.auth().onAuthStateChanged((user) => {
      if (user && user.email === ADMIN_EMAIL) window.location.href = 'admin-dashboard.html';
    });
  }
</script>
</body>
</html>
